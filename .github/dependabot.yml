# We define the interval for the updates to be monthly
# because we don't want to have too many updates
# and the project is currently in a development stage

version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github_actions
      - auto-merge
    commit-message:
      prefix: meta
    cooldown:
      default-days: 7
    groups:
      # Fallback group for all minor/patch updates
      actions:
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: '/'
    versioning-strategy: increase
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
      - auto-merge
    commit-message:
      prefix: meta
    cooldown:
      default-days: 7
    groups:
      orama:
        patterns:
          - '@orama/*'
      cli:
        patterns:
          - 'commander'
          - '@clack/prompts'
      lint:
        patterns:
          - 'eslint-*'
          - 'lint-staged'
          - 'oxlint'
          - 'oxfmt'
      unist:
        patterns:
          - 'unified'
          - 'unist-*'
          - 'vfile'
      remark:
        patterns:
          - 'remark-*'
          - 'shiki'
      rehype:
        patterns:
          - 'rehype-*'
      ast:
        patterns:
          - 'estree-*'
          - 'hast-*'
          - 'mdast-*'
          - 'hastscript'
          - 'acorn'
      recma:
        patterns:
          - 'recma-*'
      compiling:
        patterns:
          - '@swc/html-wasm'
          - '@rollup/*'
          - 'rolldown'
          - 'lightningcss-wasm'
      react:
        patterns:
          - 'preact'
          - 'preact-*'
      # Fallback groups for all other minor/patch updates
      production:
        dependency-type: production
        update-types:
          - patch
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 20
