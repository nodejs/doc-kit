<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${metadata.layout === 'home' ? 'doc-kit · The docs toolkit for APIs' : title}</title>
    <meta
      property="og:title"
      content="${metadata.layout === 'home' ? 'doc-kit · The docs toolkit for APIs' : title}"
    />
    <meta property="og:type" content="website" />
    ${metadata.synthetic ? '' : `<link rel="canonical" href="${config.baseURL}${metadata.path.replace(/(^|\/)index$/, '$1')}" />`}
    <meta
      name="theme-color"
      content="#0d121c"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <!-- Inter is the site's typeface; of doc-kit's own fonts, only the
         monospace one is used -->
    <link
      rel="preload"
      href="${root}fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    ${preloads.split('\n').filter(line => line.includes('plex-mono')).join('\n')}
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('${root}fonts/inter-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      @font-face {
        font-family: 'Inter Variable';
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url('${root}fonts/inter-latin-wght-italic.woff2')
          format('woff2-variations');
      }
    </style>

    ${assets} ${head}

    <!-- Apply theme before paint to avoid Flash of Unstyled Content -->
    <script>
      ${themeScript}
    </script>
    <!-- Marks the platforms where shortcuts take Ctrl instead of ⌘, and
         whether the last input came from a pointer or the keyboard, for the
         theme's CSS -->
    <script>
      (() => {
        const root = document.documentElement;
        const platform =
          navigator.userAgentData?.platform || navigator.platform || '';

        if (!/mac|iphone|ipad|ipod/i.test(platform)) {
          root.dataset.modifier = 'ctrl';
        }

        const track = input => () => {
          if (root.dataset.input !== input) {
            root.dataset.input = input;
          }
        };

        addEventListener('pointerdown', track('pointer'), true);
        addEventListener('keydown', track('keyboard'), true);
      })();
    </script>
    <script type="speculationrules">
      ${speculationRules}
    </script>
  </head>

  <body>
    <div id="root">${dehydrated}</div>
  </body>
</html>
